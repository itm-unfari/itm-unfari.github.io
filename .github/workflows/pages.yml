# Deploy situs statis ke GitHub Pages.
#
# Sumber Pages repo ini adalah GitHub Actions, bukan cabang main apa adanya:
# app.css adalah hasil build (di-gitignore), jadi menayangkan cabang langsung
# memberi halaman tanpa gaya. Setiap push ke main membangun CSS lalu menayangkan.
# Backend produksi belum ada (§14.2 rencana): PRODUKSI di assets/js/config.js
# masih kosong, sehingga situs publik tampil tetapi belum bisa dipakai masuk.

name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Buang node_modules sebelum unggah
        # node_modules TIDAK boleh ikut ke artifact Pages: besar, dan bukan
        # bagian dari situs. app.css sudah dibangun di langkah sebelumnya.
        run: rm -rf node_modules uji/node_modules

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
