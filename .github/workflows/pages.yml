# Deploy situs statis ke GitHub Pages.
#
# HANYA bisa dipicu manual (workflow_dispatch). GCP dan domain diputuskan
# setelah pengembangan selesai (§14.2 rencana); sampai saat itu push ke main
# tidak boleh menerbitkan frontend yang menunjuk backend yang belum ada.
# Saat keputusan itu diambil: tambahkan pemicu `push: branches: [main]` dan
# isi PRODUKSI di assets/js/config.js.

name: Deploy ke GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build CSS
        run: npm run build

      - name: Buang node_modules sebelum unggah
        # node_modules TIDAK boleh ikut ke artifact Pages: besar, dan bukan
        # bagian dari situs. app.css sudah dibangun di langkah sebelumnya.
        run: rm -rf node_modules uji/node_modules

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
