<!DOCTYPE html>
<html lang="id" data-judul="peluangUnit.judul_halaman">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internal Talent Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400..700&display=swap" rel="stylesheet">
  <script src="/assets/js/prapasang.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<main class="mx-auto max-w-4xl px-5 py-6 space-y-5">
  <div id="pesan" hidden role="alert"></div>
  <p class="text-sm text-tinta-redup" data-i18n="peluangUnit.ket"></p>
  <div id="layarPeluang" class="space-y-5"></div>
</main>

<script type="module">
import { requireLogin, requireRole } from "/assets/js/auth.js";
import { pasang } from "/assets/js/nav.js";
import { pasangLayarPeluang } from "/assets/js/peluang.js";

if (requireLogin() && requireRole("M-01")) {
    pasang("M-01");
    pasangLayarPeluang({
        akar: document.getElementById("layarPeluang"),
        elPesan: document.getElementById("pesan"),
        unitTerkunci: true,
    });
}
</script>
</body>
</html>
