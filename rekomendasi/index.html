<!DOCTYPE html>
<html lang="id" data-judul="rekomendasi.judul_halaman">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internal Talent Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400..700&display=swap" rel="stylesheet">
  <script src="/assets/js/prapasang.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<main class="mx-auto max-w-4xl px-5 py-6 space-y-5">
  <div id="pesan" hidden role="alert"></div>
  <section class="kartu p-6">
    <h2 class="eyebrow text-tinta-redup mb-4" data-i18n="rekomendasi.daftar">Peluang untuk Anda</h2>
    <div id="wadahTabel"></div>
  </section>
</main>

<script type="module">
import { getJSON } from "/assets/js/minta.js";
import { getQueryString } from "/assets/js/jscroot/url.js";
import { asal, PERAN } from "/assets/js/config.js";
import { requireLogin, requireRole, tokenHeader, getUser } from "/assets/js/auth.js";
import { sehat, el, kosongkan, lencana, tabel, baris, kosong } from "/assets/js/ui.js";
import { t } from "/assets/js/i18n.js";
import { pasang } from "/assets/js/nav.js";
import { batangKontribusi, fmt } from "/assets/js/kontribusi.js";
import { bacaSudut } from "/assets/js/sudut.js";

if (requireLogin() && requireRole("K-03")) {
    pasang("K-03");
    const elPesan = document.getElementById("pesan");
    const wadahTabel = document.getElementById("wadahTabel");
    // Pakar melihat lewat sudut pandang satu karyawan (§13.2, P-01).
    const pakar = getUser().role === PERAN.PAKAR;
    const sudut = pakar ? (getQueryString().karyawan_id || (bacaSudut() || {}).id || "") : "";

    function jenisMatch(status) {
        if (status === "diterima" || status === "berminat") return "sah";
        if (status === "ditinjau") return "tinjau";
        return "netral";
    }

    if (pakar && !sudut) {
        const p = el("p", "text-sm text-tinta-redup");
        p.appendChild(document.createTextNode(t("pakar.butuh_sudut") + " "));
        const a = el("a", "text-utama hover:underline", t("layar.P-01"));
        a.href = "/pakar/";
        p.appendChild(a);
        wadahTabel.appendChild(p);
    } else getJSON(asal + "/api/skill", function (hasilSkill) {
        if (!sehat(hasilSkill, elPesan)) return;
        const skillMap = {};
        (hasilSkill.data.data.skill || []).forEach(function (s) { skillMap[s.kode] = s; });
        muat(skillMap);
    }, ...tokenHeader());

    function muat(skillMap) {
        const url = asal + "/api/saya/rekomendasi" + (sudut ? "?karyawan_id=" + encodeURIComponent(sudut) : "");
        getJSON(url, function (hasil) {
            if (!sehat(hasil, elPesan)) return;
            const d = hasil.data.data || {};
            kosongkan(wadahTabel);
            if (!d.siklus) {
                wadahTabel.appendChild(el("p", "text-sm text-tinta-redup", t("rekomendasi.belum_ada_siklus")));
                return;
            }
            const { wadah, tbody } = tabel([
                t("rekomendasi.kolom_peluang"), t("rekomendasi.kolom_skor"),
                t("rekomendasi.kolom_status"), "",
            ]);
            const daftar = d.match || [];
            if (!daftar.length) {
                tbody.appendChild(kosong(4, t("rekomendasi.kosong")));
            } else {
                daftar.forEach(function (m) {
                    const a = el("a", "text-utama hover:underline text-sm whitespace-nowrap", t("rekomendasi.lihat_penjelasan"));
                    a.href = "/penjelasan/?id=" + encodeURIComponent(m.id);
                    const judul = el("div", "min-w-[10rem]");
                    judul.appendChild(el("div", "font-medium", m.peluang.judul));
                    judul.appendChild(el("div", "text-mikro text-tinta-redup", t("jenis." + m.peluang.jenis) + " · " + m.peluang.unit));
                    const skor = el("div", "min-w-[10rem] space-y-1.5");
                    skor.appendChild(el("div", "font-data text-sm", fmt(m.skor)));
                    skor.appendChild(batangKontribusi(m, skillMap));
                    tbody.appendChild(baris([judul, skor, lencana(t("status.match." + m.status), jenisMatch(m.status)), a]));
                });
            }
            wadahTabel.appendChild(wadah);
        }, ...tokenHeader());
    }
}
</script>
</body>
</html>
