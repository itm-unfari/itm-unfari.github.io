<!DOCTYPE html>
<html lang="id" data-judul="usulanSkill.judul_halaman">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internal Talent Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400..700&display=swap" rel="stylesheet">
  <script src="/assets/js/prapasang.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>

<main class="mx-auto max-w-3xl px-5 py-6 space-y-5">
  <div id="pesan" hidden role="alert"></div>

  <section class="kartu p-6">
    <h2 class="eyebrow text-tinta-redup mb-2" data-i18n="usulanSkill.tempel_judul">Tempel teks pengalaman Anda</h2>
    <p class="text-sm text-tinta-redup mb-4" data-i18n="usulanSkill.tempel_ket">AI membaca teks ini dan mengusulkan skill dengan kutipan buktinya.</p>
    <form id="formTeks" class="space-y-4" novalidate>
      <label for="teks" class="sr-only" data-i18n="usulanSkill.tempel_judul">Tempel teks pengalaman Anda</label>
      <textarea id="teks" class="medan" rows="6" required></textarea>
      <div class="flex flex-wrap items-center gap-3">
        <label class="text-sm font-medium" for="selBahasa" data-i18n="usulanSkill.bahasa_teks">Bahasa teks ini</label>
        <select id="selBahasa" class="medan w-auto">
          <option value="id">Indonesia</option>
          <option value="en">English</option>
        </select>
        <button type="submit" id="tombolKirim" class="tombol-utama ml-auto" data-i18n="umum.kirim">Kirim</button>
      </div>
    </form>
    <div id="status" class="mt-4 text-sm text-tinta-redup" hidden></div>
    <div id="hasilBaru" class="mt-5 space-y-3" hidden data-uji="hasil-baru"></div>
  </section>

  <section class="kartu p-6">
    <h2 class="eyebrow text-tinta-redup mb-4" data-i18n="usulanSkill.riwayat">Riwayat usulan</h2>
    <div id="riwayat" class="space-y-6"></div>
  </section>
</main>

<script type="module">
import { getJSON, postJSON } from "/assets/js/jscroot/api.js";
import { asal } from "/assets/js/config.js";
import { requireLogin, requireRole, tokenHeader } from "/assets/js/auth.js";
import { sembunyikan, sehat, el, kosongkan, lencana } from "/assets/js/ui.js";
import { t, bahasa } from "/assets/js/i18n.js";
import { pasang } from "/assets/js/nav.js";
import { teksTersorot } from "/assets/js/sorot.js";

if (requireLogin() && requireRole("K-02")) {
    pasang("K-02");
    const elPesan = document.getElementById("pesan");
    const form = document.getElementById("formTeks");
    const elTeks = document.getElementById("teks");
    const elBahasa = document.getElementById("selBahasa");
    const tombolKirim = document.getElementById("tombolKirim");
    const elStatus = document.getElementById("status");
    const elHasilBaru = document.getElementById("hasilBaru");
    const elRiwayat = document.getElementById("riwayat");
    elBahasa.value = bahasa();

    let skillMap = {};
    // Teks sumber tidak pernah dikembalikan server (TugasAI.TeksSumber
    // json:"-"), jadi sorotan pada teks asli hanya mungkin untuk teks yang
    // dikirim dari halaman ini: disimpan per usulan selama halaman terbuka.
    let tugasTerakhir = null;   // {id, teks}
    const teksPerUsulan = {};

    function namaSkill(kode) {
        const s = skillMap[kode];
        if (!s) return kode;
        return (s.nama[bahasa()] || s.nama.id || kode) + " (" + kode + ")";
    }

    function statusLencana(st) {
        const jenis = st === "diterima" || st === "diubah" ? "sah" : st === "ditolak" ? "netral" : "tinjau";
        return lencana(t("status.usulan." + st), jenis);
    }

    function gambarButir(usulanId, b) {
        const wadah = el("div", "py-3 border-b border-garis-tipis last:border-0 space-y-2");
        wadah.dataset.uji = "butir-usulan";
        const atas = el("div", "flex flex-wrap items-center gap-2");
        atas.appendChild(el("span", "font-medium", namaSkill(b.kode)));
        atas.appendChild(el("span", "text-tinta-redup text-sm", t("tingkat." + b.tingkat_perkiraan)));
        if (b.status === "usulan") {
            const ai = lencana(t("umum.tandaAI"), "tinjau");
            ai.dataset.uji = "tanda-ai";
            atas.appendChild(ai);
        } else {
            atas.appendChild(statusLencana(b.status));
            if (b.tingkat_diputuskan) atas.appendChild(el("span", "text-tinta-redup text-sm", "→ " + t("tingkat." + b.tingkat_diputuskan)));
        }
        wadah.appendChild(atas);

        const kutip = el("blockquote", "border-l-2 border-garis-kendali pl-3 text-sm text-tinta-redup italic break-words", b.kutipan);
        wadah.appendChild(kutip);

        if (b.status === "usulan") {
            const aksi = el("div", "flex flex-wrap items-center gap-2");
            const btnTerima = el("button", "tombol-halus", t("usulanSkill.terima"));
            btnTerima.type = "button";
            btnTerima.addEventListener("click", function () { putuskan(usulanId, b.kode, "diterima", null); });
            const selUbah = document.createElement("select");
            selUbah.className = "medan w-auto text-sm";
            selUbah.setAttribute("aria-label", t("profil.kolom_tingkat"));
            [1, 2, 3, 4].forEach(function (n) {
                const opt = document.createElement("option");
                opt.value = String(n);
                opt.textContent = t("tingkat." + n);
                if (n === b.tingkat_perkiraan) opt.selected = true;
                selUbah.appendChild(opt);
            });
            const btnUbah = el("button", "tombol-halus", t("usulanSkill.ubah_tingkat"));
            btnUbah.type = "button";
            btnUbah.addEventListener("click", function () { putuskan(usulanId, b.kode, "diubah", Number(selUbah.value)); });
            const btnTolak = el("button", "tombol-halus", t("usulanSkill.tolak"));
            btnTolak.type = "button";
            btnTolak.addEventListener("click", function () { putuskan(usulanId, b.kode, "ditolak", null); });
            aksi.appendChild(btnTerima);
            aksi.appendChild(selUbah);
            aksi.appendChild(btnUbah);
            aksi.appendChild(btnTolak);
            wadah.appendChild(aksi);
        }
        return wadah;
    }

    function gambarUsulan(u) {
        const kartu = el("div", "");
        const tgl = new Date(u.dibuat);
        kartu.appendChild(el("div", "text-mikro text-tinta-redup mb-1", isNaN(tgl) ? "" : tgl.toLocaleString(bahasa() === "en" ? "en-GB" : "id-ID")));
        if (teksPerUsulan[u.id]) kartu.appendChild(teksTersorot(teksPerUsulan[u.id], u.butir || []));
        const butir = u.butir || [];
        if (!butir.length) kartu.appendChild(el("p", "text-sm text-tinta-redup", t("usulanSkill.tanpa_butir")));
        butir.forEach(function (b) { kartu.appendChild(gambarButir(u.id, b)); });
        return kartu;
    }

    function putuskan(usulanId, kode, keputusan, tingkat) {
        const badan = { kode: kode, keputusan: keputusan };
        if (tingkat != null) badan.tingkat = tingkat;
        postJSON(asal + "/api/usulan-skill/" + encodeURIComponent(usulanId) + "/putuskan", badan, function (hasil) {
            if (!sehat(hasil, elPesan)) return;
            muatUsulan();
        }, ...tokenHeader());
    }

    // muatUsulan menggambar ulang panel "hasil baru" (bila ada) dan riwayat
    // dari satu permintaan, supaya keputusan di salah satunya tidak
    // meninggalkan tombol basi di yang lain.
    function muatUsulan() {
        getJSON(asal + "/api/saya/usulan-skill?limit=20", function (hasil) {
            if (!sehat(hasil, elPesan)) return;
            const daftar = hasil.data.data || [];
            kosongkan(elHasilBaru);
            const idBaru = tugasTerakhir && tugasTerakhir.hasilId;
            const baru = idBaru ? daftar.find(function (u) { return u.id === idBaru; }) : null;
            if (baru) {
                elHasilBaru.appendChild(el("h3", "font-medium", t("usulanSkill.hasil_baru")));
                elHasilBaru.appendChild(gambarUsulan(baru));
                elHasilBaru.hidden = false;
            } else {
                elHasilBaru.hidden = true;
            }
            kosongkan(elRiwayat);
            const lain = daftar.filter(function (u) { return u.id !== idBaru; });
            if (!lain.length) elRiwayat.appendChild(el("p", "text-sm text-tinta-redup", t("umum.tidak_ada_data")));
            lain.forEach(function (u) { elRiwayat.appendChild(gambarUsulan(u)); });
        }, ...tokenHeader());
    }

    function tungguTugas(tugasId, sisa) {
        getJSON(asal + "/api/tugas-ai/" + encodeURIComponent(tugasId), function (hasil) {
            if (!sehat(hasil, elPesan)) return;
            const tugas = hasil.data.data;
            if (tugas.status === "selesai") {
                elStatus.hidden = true;
                tugasTerakhir.hasilId = tugas.hasil_id;
                teksPerUsulan[tugas.hasil_id] = tugasTerakhir.teks;
                muatUsulan();
            } else if (tugas.status === "gagal") {
                elStatus.textContent = t("usulanSkill.gagal");
                elStatus.hidden = false;
            } else if (sisa <= 0) {
                elStatus.textContent = t("usulanSkill.masih_diproses");
                elStatus.hidden = false;
            } else {
                elStatus.textContent = t("usulanSkill.diproses");
                elStatus.hidden = false;
                setTimeout(function () { tungguTugas(tugasId, sisa - 1); }, 1500);
            }
        }, ...tokenHeader());
    }

    form.addEventListener("submit", function (e) {
        e.preventDefault();
        sembunyikan(elPesan);
        // Backend memangkas spasi tepi sebelum mengekstrak; posisi kutipan
        // dihitung atas teks yang sudah dipangkas.
        const teks = elTeks.value.trim();
        tombolKirim.disabled = true;
        postJSON(asal + "/api/saya/usulan-skill", { teks: teks, bahasa: elBahasa.value }, function (hasil) {
            tombolKirim.disabled = false;
            if (!sehat(hasil, elPesan)) return;
            tugasTerakhir = { id: hasil.data.data.id, teks: teks, hasilId: null };
            tungguTugas(tugasTerakhir.id, 20);
        }, ...tokenHeader());
    });

    getJSON(asal + "/api/skill", function (hasil) {
        if (!sehat(hasil, elPesan)) return;
        (hasil.data.data.skill || []).forEach(function (s) { skillMap[s.kode] = s; });
        muatUsulan();
    }, ...tokenHeader());
}
</script>
</body>
</html>
